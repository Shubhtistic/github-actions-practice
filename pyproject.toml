[project]
name = "github-actions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.32.0",
    "black>=26.10.1",
    "fastapi>=0.162.7",
    "granian[reload,uvloop]>=2.8.8",
    "greenlet>=3.5.6",
    "orjson>=3.13.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "scalar-fastapi>=1.9.3",
    "sqlalchemy>=2.1.8",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
