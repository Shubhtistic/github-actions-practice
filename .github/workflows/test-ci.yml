name: "hello world"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-before-merge:
    runs-on: ubuntu-26.04 # it has 3.14 python that we want

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: actions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      PROJECT_NAME: actions
      VERSION: 0.1.0
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: actions

    steps:
      - name: get our code
        uses: actions/checkout@v5 # official repo cloner

      - name: get uv pkg manager
        uses: astral-sh/setup-uv@v10.3.3
        with:
         python-version: "3.14"
         enable-cache: true
      
      - name: run pytest
        run: uv run pytest

