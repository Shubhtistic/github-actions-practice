name: "ci hello world"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main


jobs:
  check-linting-with-ruff:
    runs-on: ubuntu-26.04

    steps:
     - name: clone the code
       uses: actions/checkout@v7
     
     # ruff does not need python env
     # this automatically does ruff check and we can also use this later as its added in runner env
     - name: setup ruff
       uses: astral-sh/ruff-action

  do-type-checks-with-ty:
    runs-on: ubuntu-26.04
    needs:
     - check-linting-with-ruff
    
    steps:
     - name: clone the code
       uses: actions/checkout@v7
     
     - name: install uv to ue ty
       uses: astral-sh/setup-uv@10.3.3
       run: uvx ty check
  
  do-actual-tests:
    runs-on: ubuntu-26.04

    needs:
      - check-linting-with-ruff
      - do-type-checks-with-ty

    # only workflow level can be read by services by using 
    # ${{ env.POSTGRES_USER }}
    # not job level
    services:
      postgres:
        image: postgres:17 
        env:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: actions
        
        ports:
        - 5432:5432
    
    # injects variables -> this is job level
    env:
      ENVIRONMENT: test
      PROJECT_NAME: actions
      VERSION: 0.1.0
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: actions

    steps:
     - name: get the code again
       uses: actions/checkout@v7

     - name: get the python onto ths runner
       uses: actions/setup-python@v7
       with:
        python-version: "3.14"

     - name: get uv pkg manager
       uses: astral-sh/setup-uv@10.3.3
       with:
        python-version: "3.14"

     - name: run the tests
       run: uv run pytest