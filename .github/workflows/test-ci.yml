name: "hello world"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-before-merge:
    runs-on: ubuntu-26.04 # it has 3.14 python that we want
    steps:
      - name: get our code
        uses: actions/checkout@v4 # official repo cloner

      - name: get uv pkg manager
        uses: astral-sh/setup-uv@v10.3.3
        with:
         python-version: "3.14"
         enable-cache: true
      
      - name: run pytest
        run: uv run pytest

